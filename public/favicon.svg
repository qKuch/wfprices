<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d0f"/>
    </linearGradient>
    <linearGradient id="gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b6ee0"/>
      <stop offset="50%" stop-color="#5a8dee"/>
      <stop offset="100%" stop-color="#3a6abf"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Outer diamond -->
  <polygon points="16,3 29,16 16,29 3,16" fill="url(#gem)" opacity="0.25"/>

  <!-- Main gem body -->
  <polygon points="16,5 27,16 16,27 5,16" fill="url(#gem)"/>

  <!-- Top facet highlight -->
  <polygon points="16,5 27,16 16,14" fill="url(#shine)"/>

  <!-- Inner diamond detail -->
  <polygon points="16,9 23,16 16,23 9,16" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.3"/>

  <!-- Center dot -->
  <circle cx="16" cy="16" r="2" fill="#ffffff" opacity="0.6"/>

  <!-- Subtle glow ring -->
  <polygon points="16,5 27,16 16,27 5,16" fill="none" stroke="#7b6ee0" stroke-width="0.8" opacity="0.5"/>
</svg>
